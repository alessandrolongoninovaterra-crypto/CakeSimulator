<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Zeelandia Cake Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    /* Layout: full-screen designer. Header with cake name, cake canvas | product tiles over the cake layer list, footer. */
    --bg:#FFFFFF;
    --bg-2:#F7F5FA;
    --bg-3:#EFECF4;
    --ink:#1D053D;
    --ink-dim:#6E6480;
    --line:#E2DEE8;
    --purple:#1D053D;
    --purple-dark:#120226;
    --purple-soft:#EDE7F2;
    --yellow:#FFE400;
    --yellow-dark:#E6CE00;
    --yellow-soft:#FFFACC;
    --orange:#FF8A1E;
    --orange-soft:#FFE7CC;
    --red:#E13C2E;
    --red-soft:#FBD9D5;
    --radius:18px;
    --display:'Archivo',system-ui,-apple-system,'Segoe UI',sans-serif;
    --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    color-scheme:light;
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0; overflow:hidden; background:var(--bg-3); color:var(--ink); font-family:var(--body);}
  body,div,button,input,h1,h2,h3,p,span{margin:0;padding:0;}
  button,input,select,textarea{font:inherit;color:inherit;}
  button{touch-action:manipulation;}
  :focus-visible{outline:2px solid var(--orange); outline-offset:2px;}
  body{-webkit-tap-highlight-color:transparent;}
  .pc-root{
    font-family:var(--body);
    background:var(--bg-3);
    color:var(--ink);
    width:100%;
    height:100%;
    overflow:hidden;
    position:relative;
    display:flex; flex-direction:column;
  }
  #pc-app{flex:1; min-height:0; display:flex; flex-direction:column;}
  /* ---- buttons ---- */
  .pc-btn{
    padding:11px; border-radius:10px; border:none; cursor:pointer;
    font-family:var(--body); font-weight:700; font-size:13.5px; letter-spacing:.01em;
    transition:transform .1s ease, opacity .15s ease; text-decoration:none; text-align:center;
    display:inline-flex; align-items:center; justify-content:center; gap:6px; line-height:1.2;
  }
  .pc-btn:active{transform:scale(0.97);}
  .pc-btn.primary{background:var(--purple); color:#fff;}
  .pc-btn:disabled{background:var(--bg-3); color:var(--ink-dim); border-color:var(--line); cursor:not-allowed; transform:none;}
  .pc-btn.ghost{background:transparent; border:1.5px solid var(--purple); color:var(--purple);}
  .pc-btn.gold{background:var(--yellow); color:var(--purple);}
  .pc-btn.armed{background:var(--red); border-color:var(--red); color:#fff;}
  .pc-btn.small{padding:8px 12px; font-size:12.5px; border-radius:8px;}
  /* ===================== SECONDARY PAGES ===================== */
  .pc-team-bg{
    flex:1; min-height:0; overflow:hidden; background:var(--bg-3);
    padding:18px 20px 16px; display:flex; flex-direction:column;
  }
  .pc-eyebrow{
    font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--purple);
    font-weight:700; display:flex; align-items:center; gap:8px; margin-bottom:5px;
  }
  .pc-eyebrow::before{content:""; width:18px; height:4px; background:var(--yellow); display:inline-block;}
  .pc-title{font-family:var(--display); font-weight:900; font-size:22px; line-height:1.08; color:var(--purple); letter-spacing:-0.01em;}
  .pc-field-label{font-size:10.5px; font-weight:700; text-transform:uppercase; letter-spacing:.06em; color:var(--ink-dim); margin-bottom:5px; display:block;}
  .pc-name-input{
    width:100%; background:var(--bg); border:1.5px solid var(--line);
    color:var(--ink); padding:9px 11px; border-radius:10px; font-size:13.5px;
    font-family:var(--body); font-weight:500;
  }
  .pc-name-input:focus{outline:none; border-color:var(--purple);}
  .pc-name-input:disabled{background:var(--bg-2); color:var(--ink-dim);}
  .pc-recipe-footer{
    flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:10px 14px; flex-wrap:wrap;
    background:var(--bg); border:1.5px solid var(--line); border-radius:14px; padding:9px 16px; margin-top:10px;
  }
  .pc-recipe-footer .pc-btn{flex-shrink:0;}
  .pc-footer-stats{display:flex; gap:18px; align-items:center; flex-wrap:wrap;}
  .pc-footer-count{font-family:var(--display); font-weight:800; font-size:17px; color:var(--purple); font-variant-numeric:tabular-nums;}
  .pc-footer-note{font-size:11px; color:var(--ink-dim); font-weight:600;}
  .pc-footer-note.ok{color:var(--purple);}
  .pc-footer-note.warn{color:var(--red);}
  .pc-footer-btns{display:flex; gap:8px;}
  .pc-settings-note{font-size:11.5px; color:var(--ink-dim); margin-top:4px; line-height:1.4;}
  /* ===================== PIZZA DESIGNER (team page) ===================== */
  .dz{font-size:clamp(11px,1.55vmin,16px); padding:.9em 16px .9em;}
  .dz-head{display:flex; flex-wrap:wrap; align-items:center; gap:.6em 1.1em; padding-bottom:.7em; border-bottom:3px solid var(--purple); margin-bottom:.8em; flex-shrink:0;}
  .dz-idblock{display:flex; align-items:center; gap:.8em;}
  .dz-idblock .pc-eyebrow{margin:0; font-size:.8em;}
  .dz-idblock{min-width:0; max-width:40%;}
  .dz-idblock > div{min-width:0;}
  .dz-idblock .pc-title{font-size:2em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0;}
  .dz-fields{display:flex; gap:.7em; flex:1 1 22em; min-width:0;}
  .dz-fields label{flex:1; min-width:0;}
  .dz-fields .pc-field-label{font-size:.75em; margin-bottom:.25em;}
  .dz-fields .pc-name-input{font-size:1em; padding:.5em .7em;}
  .dz-bench{flex:1; min-height:0; display:grid; grid-template-columns:minmax(0,3fr) minmax(0,2fr); /* 3/5 disegno, 2/5 menu */ gap:.9em;}
  .dz-stage{min-height:0; min-width:0; display:flex; background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:.6em;}
  .dz-stage canvas{width:100%; height:100%; object-fit:contain; display:block;}
  .dz-side{min-height:0; min-width:0; display:flex; flex-direction:column; gap:.8em;}
  .dz-box{background:var(--bg); border:1px solid var(--line); border-radius:14px; padding:.7em .8em; min-height:0; display:flex; flex-direction:column; overflow:hidden;}
  .dz-lib{flex:1 1 0; gap:.45em;}
  .dz-rec{flex:1.15 1 0;}
  @media (orientation:portrait){
    .dz-bench{grid-template-columns:minmax(0,1fr); grid-template-rows:minmax(0,1.2fr) minmax(0,1fr);}
    .dz-side{flex-direction:row;}
    .dz-lib,.dz-rec{flex:1 1 0; min-width:0;}
  }
  .dz-tabs{display:flex; flex-wrap:wrap; gap:.3em; flex:none;}
  .dz-tab{border:1.5px solid var(--line); background:var(--bg-2); border-radius:.5em; padding:.35em .7em; min-height:2.5em; font-size:.92em; font-weight:700; cursor:pointer; color:var(--ink);}
  .dz-tab[aria-selected="true"]{background:var(--purple); color:#fff; border-color:var(--purple);}
  .dz-tab b{margin-left:.35em; background:var(--yellow); color:var(--purple); border-radius:99px; padding:0 .45em; font-size:.85em;}
  .dz-note{margin:0; font-size:.85em; color:var(--ink-dim); font-weight:600; flex:none;}
  .dz-note.warn{color:var(--red);}
  .dz-tiles{flex:1 1 0; min-height:0; overflow:hidden; font-size:calc(var(--ts,1) * 1em); display:grid; grid-template-columns:repeat(auto-fill,minmax(6.6em,1fr)); gap:.65em; align-content:start; padding:.55em .55em .2em .15em;}
  .dz-tile{position:relative; border:1.5px solid var(--line); border-radius:.7em; background:var(--bg-2);}
  .dz-tile.sel{border-color:var(--yellow-dark); background:var(--yellow-soft); box-shadow:0 0 0 2px rgba(255,228,0,.45);}
  .dz-tile.on{border-color:var(--purple);}
  .dz-tbtn{display:flex; flex-direction:column; align-items:center; gap:.3em; width:100%; padding:.7em .3em .5em; background:transparent; border:0; cursor:pointer; color:var(--ink); border-radius:.7em;}
  .dz-tbtn:active{background:var(--purple-soft);}
  .dz-tbtn:disabled{cursor:not-allowed; opacity:.45;}
  .dz-tn{font-size:.88em; line-height:1.15; text-align:center; min-height:2.3em; overflow-wrap:break-word; hyphens:auto; font-weight:700; max-width:100%;}
  .dz-badge{position:absolute; top:-.55em; right:-.55em; min-width:1.9em; height:1.9em; padding:0 .4em; border-radius:1em; background:var(--purple); color:var(--yellow); font:800 .9em/1.9em var(--display); text-align:center; pointer-events:none;}
  .dz-tedit{position:absolute; top:.1em; left:.1em; width:2.2em; height:2.2em; border:0; background:transparent; color:var(--ink-dim); cursor:pointer; border-radius:.5em; display:grid; place-items:center; padding:0;}
  .dz-tedit svg{width:1.15em; height:1.15em;}
  .dz-tedit:hover{background:var(--purple-soft); color:var(--purple);}
  .dz-thumb{flex:none; width:3.6em; height:3.6em; display:grid; place-items:center;}
  .dz-thumb img{max-width:100%; max-height:100%; display:block;}
  .dz-thumb.sm{width:2.7em; height:2.7em;}
  .dz-thumb.big{width:5.5em; height:5.5em;}
  .dz-rechead{display:flex; align-items:center; gap:.5em; flex:none; margin-bottom:.3em;}
  .dz-rechead h3{font-family:var(--display); font-weight:800; font-size:1.05em; color:var(--purple); text-transform:uppercase; letter-spacing:.05em; margin-right:auto;}
  .dz-rechead .pc-btn{font-size:.85em; padding:.45em .7em; min-height:2.4em;}
  .dz-layers{list-style:none; margin:0; padding:0; flex:1 1 0; min-height:0; overflow:hidden; font-size:calc(var(--rs,1) * 1em); display:grid; grid-template-columns:repeat(var(--lc,1),minmax(0,1fr)); column-gap:.9em; align-content:start;}
  .dz-layers.c2{--lc:2}
  .dz-layers.c2 .dz-thumb,.dz-layers.c2 .dz-ud,.dz-layers.c2 [data-act="dz-reshuffle"],.dz-layers.tight .dz-lname small{display:none;}
  .dz-layer{display:flex; align-items:center; gap:.55em; padding:.35em 0; border-bottom:1px solid var(--line);}
  .dz-lname{flex:1 1 0; min-width:0; font-weight:700; line-height:1.2; overflow-wrap:break-word; hyphens:auto;}
  .dz-layers.c2 .dz-lname{white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .dz-lname small{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:600; font-size:.78em; color:var(--ink-dim); text-transform:uppercase; letter-spacing:.04em;}
  .dz-step{flex:none; display:inline-flex; align-items:center; border:1.5px solid var(--line); border-radius:.5em; background:var(--bg); overflow:hidden;}
  .dz-step button{border:0; background:transparent; width:2.3em; height:2.5em; font-size:1.25em; cursor:pointer; line-height:1; padding:0; color:var(--purple); font-weight:700;}
  .dz-step button:active{background:var(--yellow-soft);}
  .dz-step input{width:2.9em; height:2.5em; text-align:center; border:0; border-inline:1.5px solid var(--line); background:transparent; font-family:var(--display); font-weight:800; font-size:1em; -moz-appearance:textfield; padding:0; color:var(--purple);}
  .dz-step input::-webkit-outer-spin-button,.dz-step input::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  .dz-ibtn{flex:none; border:1.5px solid var(--line); background:var(--bg); border-radius:.5em; width:2.4em; height:2.5em; cursor:pointer; font-size:1.05em; line-height:1; padding:0; color:var(--purple);}
  .dz-ibtn:hover{border-color:var(--purple);}
  .dz-ibtn.rm:hover{color:var(--red); border-color:var(--red);}
  .dz-ud{flex:none; display:flex; flex-direction:column; gap:.15em;}
  .dz-ud .dz-ibtn{height:1.25em; width:2em; font-size:.75em; border-radius:.4em;}
  .dz-layers button:disabled,.dz-layers input:disabled{opacity:.4; cursor:not-allowed;}
  .dz-empty{grid-column:1/-1; color:var(--ink-dim); padding:.6em 0; font-weight:600; font-size:.95em;}
  /* sheet + toast */
  .dz-sheet{position:fixed; inset:0; background:rgba(18,2,38,.55); display:grid; place-items:center; padding:16px; z-index:400;}
  .dz-sheet[hidden],.dz-toast[hidden]{display:none;}
  .dz-sheet-panel{background:var(--bg); border-radius:16px; padding:18px; width:min(420px,100%); max-height:100%; overflow:auto; display:grid; gap:14px; box-shadow:0 20px 50px rgba(18,2,38,.3);}
  .dz-shead{display:flex; gap:14px; align-items:center;}
  .dz-shead h3{font-family:var(--display); font-weight:800; font-size:20px; color:var(--purple);}
  .dz-fld{display:grid; grid-template-columns:100px minmax(0,1fr) 46px; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--ink-dim);}
  .dz-fld input[type=range]{width:100%; accent-color:var(--purple); min-width:0; height:28px;}
  .dz-fld output,.dz-fld .unit{font-weight:700; font-size:12.5px; color:var(--ink); text-align:right;}
  .dz-fld input[type=number]{width:100%; min-width:0; background:var(--bg); border:1.5px solid var(--line); border-radius:8px; padding:6px 8px; font-weight:600;}
  .dz-toast{position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--purple); color:#fff; padding:10px 16px; border-radius:10px; font-size:13px; font-weight:600; max-width:calc(100% - 32px); z-index:600; box-shadow:0 8px 24px rgba(18,2,38,.3);}
  @media (max-width:640px){
    html,body{overflow:auto;}
    .pc-root{height:auto; min-height:100%; overflow:visible;}
    .pc-team-bg{overflow:visible;}
    .dz-bench{grid-template-columns:minmax(0,1fr); grid-template-rows:auto;}
    .dz-stage canvas{height:auto; aspect-ratio:1;}
    .dz-side{flex-direction:column;}
    .dz-lib,.dz-rec{flex:none;}
    .dz-tiles,.dz-layers{flex:none; overflow:visible;}
  }
  /* ===================== iOS-STYLE LAYER: large rounded controls, gloss, soft depth ===================== */
  :root{
    --gloss: linear-gradient(180deg, rgba(255,255,255,.42) 0%, rgba(255,255,255,.14) 48%, rgba(255,255,255,0) 52%, rgba(0,0,0,.07) 100%);
    --gloss-soft: linear-gradient(180deg, rgba(255,255,255,.95) 0%, rgba(255,255,255,.6) 50%, rgba(247,245,250,.4) 51%, rgba(239,236,244,.7) 100%);
    --lift: inset 0 1px 0 rgba(255,255,255,.55), inset 0 -1px 0 rgba(0,0,0,.08), 0 1px 2px rgba(29,5,61,.16), 0 6px 16px rgba(29,5,61,.14);
    --lift-soft: inset 0 1px 0 #fff, 0 1px 2px rgba(29,5,61,.08), 0 4px 12px rgba(29,5,61,.07);
    --r-btn: 14px;
  }
  body{-webkit-font-smoothing:antialiased;}
  .pc-root{background:linear-gradient(180deg,#F3F0F8 0%,#E9E4F1 100%);}
  .pc-team-bg{background:transparent;}
  /* buttons */
  .pc-btn{
    min-height:46px; padding:12px 18px; border-radius:var(--r-btn); font-size:14.5px; font-weight:700;
    background-image:var(--gloss); box-shadow:var(--lift); border:0;
    transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  }
  .pc-btn:hover{filter:brightness(1.05);}
  .pc-btn:active{transform:scale(.96); box-shadow:inset 0 2px 5px rgba(0,0,0,.22), 0 1px 1px rgba(29,5,61,.1); filter:brightness(.95);}
  .pc-btn.small{min-height:42px; padding:9px 15px; font-size:13.5px; border-radius:12px;}
  .pc-btn.primary{background-color:#3A1470; background-image:var(--gloss),linear-gradient(180deg,#4A1C8C 0%,#1D053D 100%); color:#fff; text-shadow:0 -1px 0 rgba(0,0,0,.3);}
  .pc-btn.gold{background-color:var(--yellow); background-image:var(--gloss),linear-gradient(180deg,#FFF06A 0%,#FFD600 100%); color:var(--purple);}
  .pc-btn.ghost{background-color:#fff; background-image:var(--gloss-soft); border:0; box-shadow:var(--lift-soft), inset 0 0 0 1.5px rgba(29,5,61,.18); color:var(--purple);}
  .pc-btn.armed{background-color:var(--red); background-image:var(--gloss),linear-gradient(180deg,#F2604F 0%,#C92A1D 100%); color:#fff;}
  .pc-btn:disabled{background-color:#E7E3ED; background-image:var(--gloss-soft); box-shadow:inset 0 0 0 1px var(--line); color:#A39AB3; text-shadow:none; filter:none; transform:none;}
  /* panels and cards: soft rounded, gentle depth */
  .dz-box,.dz-stage,.pc-recipe-footer{border-radius:24px; border:0; box-shadow:0 1px 2px rgba(29,5,61,.06), 0 10px 30px rgba(29,5,61,.08); background:rgba(255,255,255,.92);}
  .pc-recipe-footer{padding:10px 14px 10px 20px;}
  /* inputs: iOS fields */
  .pc-name-input,.dz-fld input[type=number]{border-radius:12px; border:0; background:#fff; box-shadow:inset 0 0 0 1px var(--line), inset 0 2px 3px rgba(29,5,61,.05); min-height:42px;}
  .pc-name-input:focus{box-shadow:inset 0 0 0 2px #7B4FD0, 0 0 0 4px rgba(123,79,208,.15);}
  /* designer: segmented tabs */
  .dz-tabs{background:rgba(118,118,128,.12); border-radius:14px; padding:3px; gap:2px; margin-top:.4em;}
  .dz-tab{flex:1 1 auto; border:0; background:transparent; border-radius:11px; min-height:2.9em; padding:.35em .8em; color:var(--purple);}
  .dz-tab[aria-selected="true"]{background-color:#fff; background-image:var(--gloss-soft); color:var(--purple); box-shadow:0 1px 1px rgba(0,0,0,.06), 0 3px 8px rgba(29,5,61,.14);}
  .dz-tab b{background-image:var(--gloss),linear-gradient(180deg,#FFF06A,#FFD600);}
  /* designer: ingredient tiles like app icons */
  .dz-tile{border:0; border-radius:1.1em; background-color:#fff; background-image:var(--gloss-soft); box-shadow:var(--lift-soft), inset 0 0 0 1px rgba(29,5,61,.06);}
  .dz-tile.on{box-shadow:var(--lift-soft), inset 0 0 0 2px var(--purple);}
  .dz-tile.sel{background-color:var(--yellow-soft); background-image:linear-gradient(180deg,rgba(255,255,255,.85),rgba(255,255,255,.3) 50%,rgba(255,255,255,0) 51%); box-shadow:var(--lift-soft), inset 0 0 0 2px var(--yellow-dark), 0 0 0 3px rgba(255,228,0,.35);}
  .dz-tbtn{border-radius:1.1em; transition:transform .12s ease;}
  .dz-tbtn:active{transform:scale(.94); background:transparent;}
  .dz-thumb img{filter:drop-shadow(0 2px 3px rgba(0,0,0,.2));}
  .dz-badge{background-image:var(--gloss),linear-gradient(180deg,#4A1C8C,#1D053D); box-shadow:0 0 0 2px #fff, 0 2px 6px rgba(29,5,61,.3);}
  /* designer: stepper + icon buttons */
  .dz-step{border:0; border-radius:.9em; background-color:#fff; background-image:var(--gloss-soft); box-shadow:var(--lift-soft), inset 0 0 0 1px var(--line);}
  .dz-step button{width:2.6em; height:2.8em;}
  .dz-step button:active{background:rgba(29,5,61,.08);}
  .dz-step input{height:2.8em; border-inline:1px solid var(--line);}
  .dz-ibtn{border:0; border-radius:.8em; width:2.6em; height:2.8em; background-color:#fff; background-image:var(--gloss-soft); box-shadow:var(--lift-soft), inset 0 0 0 1px var(--line);}
  .dz-ibtn:active{transform:scale(.92);}
  .dz-ibtn.rm{color:var(--red);}
  .dz-ud .dz-ibtn{height:1.35em; width:2.2em; border-radius:.5em;}
  .dz-rechead .pc-btn{min-height:2.7em; font-size:.85em; padding:.4em .9em; border-radius:12px;}
  /* sheets, toast, chips */
  .dz-sheet{-webkit-backdrop-filter:blur(6px); backdrop-filter:blur(6px);}
  .dz-sheet-panel{border-radius:24px;}
  .dz-toast{border-radius:16px; background:rgba(29,5,61,.88); -webkit-backdrop-filter:blur(12px); backdrop-filter:blur(12px); padding:12px 18px;}
  .dz-tabs{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); row-gap:4px;}
  .dz-tab{position:relative; flex:1 1 0; min-width:0; white-space:nowrap; overflow:visible; padding:.35em .25em; font-size:.88em;}
  .dz-tab b{position:absolute; top:-.45em; right:-.2em; margin:0; min-width:1.6em; line-height:1.6em; padding:0 .35em; border-radius:99px; box-shadow:0 1px 3px rgba(29,5,61,.25); z-index:1;}
  @media (prefers-reduced-motion:reduce){ .pc-btn,.dz-tbtn{transition:none;} }
  /* ===================== MOTION + HERO LAYER (aubergine & yellow) ===================== */
  :root{
    --aub-900:#12021F; --aub-800:#1D053D; --aub-700:#2E0B57; --aub-600:#44167E; --aub-500:#6A2FB0; --aub-300:#B597E0;
    --sun-300:#FFF3A0; --sun-400:#FFE45C; --sun-500:#FFD60A; --sun-600:#F5B82E;
    --spring: cubic-bezier(.32,1.28,.54,1);
  }
  /* ambient aurora behind everything */
  .pc-root{background:#EEEAF5; isolation:isolate; overflow:clip;}
  #pc-app,.pc-team-bg{overflow-x:clip;}
  .pc-root::before,.pc-root::after{content:""; position:fixed; z-index:-1; pointer-events:none; border-radius:50%; filter:blur(70px); opacity:.55; will-change:transform;}
  .pc-root::before{width:60vmax; height:60vmax; left:-18vmax; top:-22vmax; background:radial-gradient(circle, rgba(255,214,10,.55), rgba(255,214,10,0) 65%); animation:auroraA 26s ease-in-out infinite alternate;}

  @keyframes plate{35%{transform:scale(.985);}100%{transform:none;}}
  .pc-footer-count{display:inline-block;}

  // texture di uno strato visto in sezione (il chiamante ha già fatto clip)
  function fillTex(g,kind,col,x0,y0,x1,y1,seed,u){
    const r=rng(seed), w=x1-x0, h=y1-y0, area=w*h;
    const q=g.createLinearGradient(0,y0,0,y1);
    if(kind==="cream"||kind==="mousse"||kind==="almond"){ q.addColorStop(0,tone(col,.3)); q.addColorStop(.5,col); q.addColorStop(1,tone(col,-.1)); }
    else if(kind==="jam"||kind==="fill"||kind==="ganache"||kind==="spread"){ q.addColorStop(0,tone(col,.2)); q.addColorStop(.35,col); q.addColorStop(1,tone(col,-.25)); }
    else { q.addColorStop(0,tone(col,-.18)); q.addColorStop(.12,col); q.addColorStop(.88,col); q.addColorStop(1,tone(col,-.22)); }
    g.fillStyle=q; g.fillRect(x0,y0,w,h);
    const dots=(n,c,a,b)=>{ g.fillStyle=c; n=Math.min(3000,n|0); for(let i=0;i<n;i++){ g.beginPath(); g.arc(x0+r()*w,y0+r()*h,(a+r()*(b-a))*u,0,7); g.fill(); } };
    switch(kind){
      case "sponge": dots(area/(u*u*55),tone(col,-.32,.35),.5,1.5); dots(area/(u*u*90),tone(col,.4,.45),.4,1.1); break;
      case "leavened": { // alveoli allungati in verticale e fibre chiare, tipici dei grandi lievitati
        g.fillStyle=tone(col,-.32,.45); for(let i=0;i<Math.min(900,area/(u*u*55));i++){ g.beginPath(); g.ellipse(x0+r()*w,y0+r()*h,(.6+r()*1.4)*u,(1.6+r()*4.5)*u,(r()-.5)*.5,0,7); g.fill(); }
        g.strokeStyle=tone(col,.4,.35); g.lineWidth=.6*u; for(let i=0;i<Math.min(400,area/(u*u*160));i++){ const x=x0+r()*w, yy=y0+r()*h; g.beginPath(); g.moveTo(x,yy); g.quadraticCurveTo(x+(r()-.5)*3*u,yy-4*u,x+(r()-.5)*2*u,yy-8*u); g.stroke(); }
        break; }
      case "bread": case "rustic": { // mollica di pane: alveoli tondi irregolari; il rustico ha anche semi e fiocchi
        g.fillStyle=tone(col,-.3,.42); for(let i=0;i<Math.min(900,area/(u*u*50));i++){ g.beginPath(); g.ellipse(x0+r()*w,y0+r()*h,(.5+r()*2.2)*u,(.4+r()*1.6)*u,r()*3,0,7); g.fill(); }
        g.fillStyle=tone(col,.45,.4); for(let i=0;i<Math.min(500,area/(u*u*110));i++){ g.beginPath(); g.arc(x0+r()*w,y0+r()*h,(.3+r()*.8)*u,0,7); g.fill(); }
        if(kind==="rustic"){ const seeds=['rgba(70,55,40,.8)','rgba(40,28,20,.85)','rgba(236,224,196,.85)','rgba(120,104,70,.8)'];
          for(let i=0;i<Math.min(700,area/(u*u*35));i++){ g.save(); g.translate(x0+r()*w,y0+r()*h); g.rotate(r()*3); g.fillStyle=seeds[i%4]; g.beginPath(); g.ellipse(0,0,(.8+r()*1.2)*u,(.35+r()*.4)*u,0,0,7); g.fill(); g.restore(); } }
        break; }
      case "biscuit": dots(area/(u*u*25),tone(col,-.4,.45),.3,.9); break;
      case "puff": { g.lineWidth=.8*u; for(let y=y0+1.6*u,i=0;y<y1;y+=1.8*u,i++){ g.strokeStyle=i%2?tone(col,.35,.8):tone(col,-.25,.7); g.beginPath(); for(let x=x0;x<=x1;x+=4*u) g.lineTo(x,y+Math.sin(x/(6*u)+i)*.5*u); g.stroke(); } break; }
      case "cream": dots(area/(u*u*400),tone(col,.5,.35),1,2.5); break;
      case "mousse": dots(area/(u*u*35),tone(col,.6,.7),.25,.7); break;
      case "fill": { g.fillStyle=tone(col,.3,.25); g.fillRect(x0,y0+h*.18,w,h*.12);
        for(let i=0;i<Math.min(400,area/(u*u*45));i++){ g.fillStyle=r()<.5?tone(col,-.3,.95):tone(col,.22,.95); g.beginPath(); g.ellipse(x0+r()*w,y0+h*(.2+r()*.6),(1.6+r()*2.2)*u,Math.min(h*.38,(1+r()*1.4)*u),r()*.6-.3,0,7); g.fill(); } break; }
      case "jam": g.fillStyle=tone(col,.45,.35); g.fillRect(x0,y0+h*.22,w,Math.max(1,h*.12)); dots(area/(u*u*60),tone(col,-.4,.4),.2,.5); break;
      case "ganache": case "spread": g.fillStyle=tone(col,.35,.3); g.fillRect(x0,y0+h*.2,w,Math.max(1,h*.14)); break;
      case "almond": dots(area/(u*u*30),tone(col,-.3,.45),.2,.6); break;
      case "crunch": { for(let i=0;i<Math.min(500,area/(u*u*14));i++){ g.save(); g.translate(x0+r()*w,y0+r()*h); g.rotate(r()*3); g.fillStyle=r()<.5?tone(col,.3):tone(col,-.25); g.fillRect(-1.6*u,-.5*u,3.2*u,1*u); g.restore(); } break; }
    }
  }

  // fronte di un piano rotondo/quadrato fra yb (base) e yt (cima)
  function bodyPath(g,cx,yb,yt,rx,ry,sq){
    g.beginPath();
    if(sq){ g.rect(cx-rx,yt,rx*2,yb-yt); return; }
    g.moveTo(cx-rx,yt); g.lineTo(cx-rx,yb); g.ellipse(cx,yb,rx,ry,0,Math.PI,0,true); g.lineTo(cx+rx,yt); g.ellipse(cx,yt,rx,ry,0,0,Math.PI,false); g.closePath();
  }
  function topPath(g,cx,yt,rx,ry,sq){
    g.beginPath();
    if(sq){ const dx=rx*.16, dy=rx*.4; g.moveTo(cx-rx,yt); g.lineTo(cx+rx,yt); g.lineTo(cx+rx-dx,yt-dy); g.lineTo(cx-rx+dx,yt-dy); g.closePath(); return; }
    g.ellipse(cx,yt,rx,ry,0,0,7);
  }
  function shadeBody(g,cx,yb,yt,rx,ry,sq){
    g.save(); bodyPath(g,cx,yb,yt,rx,ry,sq); g.clip();
    const q=g.createLinearGradient(cx-rx,0,cx+rx,0);
    if(sq){ q.addColorStop(0,'rgba(0,0,0,.10)'); q.addColorStop(.5,'rgba(255,255,255,.04)'); q.addColorStop(1,'rgba(0,0,0,.14)'); }
    else { q.addColorStop(0,'rgba(0,0,0,.30)'); q.addColorStop(.18,'rgba(0,0,0,.04)'); q.addColorStop(.38,'rgba(255,255,255,.12)'); q.addColorStop(.75,'rgba(0,0,0,.04)'); q.addColorStop(1,'rgba(0,0,0,.34)'); }
    g.fillStyle=q; g.fillRect(cx-rx-2,yt-rx,rx*2+4,yb-yt+rx*2); g.restore();
  }
  // quantità di copertura 0–1: 0 = solo la superficie superiore, 1 = tutto il fianco
  const coatPct = r => Math.max(0,Math.min(100,r.coatPct==null?30:r.coatPct))/100;
  // peso: la parte superiore vale ~40% della copertura completa
  const coatWeightK = r => .4+.6*coatPct(r);
  const ease = t => 1-Math.pow(1-Math.max(0,Math.min(1,t)),3);

  function drawCake(ctx,S,r,opts={}){
    if(["loaf","muffin","panettone","pagnotta","bun"].includes(r.shape)) return drawBaked(ctx,S,r,opts);
    const an=opts.anim||null, u=S/400, cx=S/2, sq=r.shape==="square", inside=!!opts.interior;
    ctx.clearRect(0,0,S,S);
    if(opts.bg){ ctx.fillStyle=opts.bg; ctx.fillRect(0,0,S,S); }
    const layers=r.layers.filter(l=>ITEM[l.ingId]);

  // decorazioni: place(rnd, diametro, indice, tipo, tentativo) → {x,y} sulla superficie superiore

  function drawDecos(ctx,S,r,an,ref,place,origin,hits){
    const pts=[];
    r.decos.filter(d=>ITEM[d.ingId]).forEach(d=>{
      const it=ITEM[d.ingId], art=kindFor(it,"deco"), def=DECO_DEF[art]||DECO_DEF.chunk, m=metaOf(d.ingId);
      const img=getDecoArt(art,it.col), dia=ref*m.size/100, rnd=rng(d.seed), mine=[];
      for(let i=0;i<d.count;i++){
        let best=null;

          const c=place(rnd,dia,i,art,t);
          if(t===29||mine.every(o=>Math.hypot(o.x-c.x,(o.y-c.y)*2.2)>=dia*.7*(1-t/40))){ best=c; break; }
        }
        mine.push(best); // le collisioni usano sempre le posizioni automatiche, così spostare un pezzo non sposta gli altri

      if(p.up){ ctx.rotate(p.rot); ctx.drawImage(p.img,-128*p.k,-236*p.k,256*p.k,256*p.k); }
      else { ctx.scale(1,.62); ctx.rotate(p.rot); ctx.drawImage(p.img,-128*p.k,-128*p.k,256*p.k,256*p.k); }
      ctx.restore();

    });
  }

  // ---- inclusioni nell'impasto (solo vista interna) ----

  // ---- plumcake, muffin e panettone: vista frontale in sezione, altezza fissa, strati in proporzione ----

  function drawBaked(ctx,S,r,opts){

              </div>
              <div class="dz-shape" id="dz-shape">${shapeHtml()}</div>
              <ul class="dz-layers" id="dz-layers">${layersHtml()}</ul>
            </section>
          </div>
        </div>
        <div class="pc-recipe-footer" id="dz-footer">${footerHtml()}</div>
      </div>`;
    const [nc,nt]=noteHtml(); const n=$("#dz-note"); n.className="dz-note "+nc; n.textContent=nt;
    drawCakeCanvas(); scheduleFit();
  }
  let lastPicked=null, newLayerId=null, cakeAnim=null, animRaf=0, decoHits=[];
  function drawCakeCanvas(){
    const cv=$("#dz-cv"); if(!cv) return;
    const ctx=cv.getContext("2d");
    if(!cakeAnim||window.matchMedia("(prefers-reduced-motion:reduce)").matches){ cakeAnim=null; const hits=[]; drawCake(ctx,cv.width,cake.recipe,{hits,interior:viewMode==="in"}); decoHits=hits; return; }
    cancelAnimationFrame(animRaf);
    const a=cakeAnim, t0=performance.now(), dur=a.coat!=null?600:650;
    const step=now=>{
      const t=Math.min(1,(now-t0)/dur);
      if(!$("#dz-cv")) return;
      const hits=[]; drawCake(ctx,cv.width,cake.recipe,t<1?{anim:{layer:a.layer,deco:a.deco,from:a.from||0,t,coat:a.coat!=null?t:null},interior:viewMode==="in"}:{hits,interior:viewMode==="in"}); if(t>=1) decoHits=hits;
      if(t<1) animRaf=requestAnimationFrame(step); else cakeAnim=null;
    };
    animRaf=requestAnimationFrame(step);
  }
  function animateTilesEnter(){ const el=$("#dz-tiles"); if(!el) return; el.scrollTop=0; el.classList.remove("enter"); void el.offsetWidth; el.classList.add("enter"); clearTimeout(el._t); el._t=setTimeout(()=>el.classList.remove("enter"),900); }
  function refreshDesigner(){
    $("#dz-tabs").innerHTML=tabsHtml();
    const tl=$("#dz-tiles"), sc=tl.scrollTop; tl.innerHTML=tilesHtml(); tl.scrollTop=sc;
    const [nc,nt]=noteHtml(); const n=$("#dz-note"); n.className="dz-note "+nc; n.textContent=nt;
    $("#dz-shape").innerHTML=shapeHtml();
    $("#dz-layers").innerHTML=layersHtml();
    const prevCount=($(".pc-footer-count")||{}).textContent;
    $("#dz-footer").innerHTML=footerHtml();
    const fc=$(".pc-footer-count"); if(fc&&prevCount&&fc.textContent!==prevCount) fc.classList.add("bump");
    drawCakeCanvas(); scheduleFit();
    lastPicked=null; newLayerId=null;
  }

  function useAs(id,role){
    if(!ITEM[id]) return;
    const r=cake.recipe, st=recipeStats(r), m=metaOf(id);
    lastPicked=id;
    if(role==="mix"){
      const art=mixArtOf(ITEM[id]); if(!art) return;
      if(!st.layers){ toast("Aggiungi prima uno strato di impasto."); return; }
      const ex=(r.mix||(r.mix=[])).find(x=>x.ingId===id);
      if(ex) ex.count=Math.min(99,ex.count+Math.max(2,Math.round(DECO_DEF[art][1]/3)));
      else { if(st.mixTypes>=MAX_MIX){ toast(`Massimo ${MAX_MIX} prodotti nell'impasto. Togline uno prima.`); return; }
        const x={id:uid(), ingId:id, count:DECO_DEF[art][1], seed:newSeed(), layer:defaultMixLayer(r.layers.filter(l=>ITEM[l.ingId])).id}; r.mix.push(x); newLayerId=x.id; }
      if(viewMode!=="in"){ viewMode="in"; toast("Vista interna: ora vedi cosa c'è nell'impasto."); }
      cakeAnim=null; refreshDesigner(); return;
    }
    if(role==="coat"){ r.coat=r.coat===id?null:id; cakeAnim=r.coat?{coat:0}:null; refreshDesigner(); return; }
    if(role==="layer"){
      if(st.layers>=MAX_LAYERS){ toast(`Massimo ${MAX_LAYERS} strati. Togline uno prima.`); return; }
      const lk=kindFor(ITEM[id],"layer"), L={id:uid(), ingId:id, thick:(LAYER_DEF[lk]||LAYER_DEF.sponge)[0], seed:newSeed()};
      r.layers.push(L); cakeAnim={layer:L.id}; newLayerId=L.id; refreshDesigner(); return;
    }
    const ex=r.decos.find(d=>d.ingId===id);
    if(ex){ const from=ex.count; ex.count=Math.min(99,ex.count+Math.max(1,Math.round(m.n/3))); cakeAnim={deco:ex.id,from}; refreshDesigner(); return; }
    if(st.decoTypes>=MAX_DECOS){ toast(`Massimo ${MAX_DECOS} tipi di decorazione. Togline uno prima.`); return; }
    const d={id:uid(), ingId:id, count:m.n, seed:newSeed()};
    r.decos.push(d); cakeAnim={deco:d.id,from:0}; newLayerId=d.id; refreshDesigner();
  }
  let clearArm=0;
  function resetClear(){ clearTimeout(clearArm); clearArm=0; const b=$("#dz-clear"); if(b){ b.textContent="Svuota"; b.classList.remove("armed"); } }
  function clearAll(btn){
    const r=cake.recipe;
    if(!r.layers.length&&!r.coat&&!r.decos.length&&!(r.mix||[]).length){ toast("La torta è già vuota."); return; }
    if(!clearArm){ btn.textContent="Tocca per confermare"; btn.classList.add("armed"); clearArm=setTimeout(resetClear,3000); return; }
    resetClear(); r.layers=[]; r.coat=null; r.decos=[]; r.mix=[]; activeCat="impasti"; refreshDesigner(); toast("Torta svuotata.");
  }

  // ---- adatta l'elenco "La torta" al riquadro ----
  function fitVar(el,name,max,min){
    const fits=v=>{ el.style.setProperty(name,v); return el.scrollHeight<=el.clientHeight+1; };
    if(fits(max)) return;
    const steps=[max]; let v=max; while(v>min){ v=Math.round((v-.04)*100)/100; steps.push(v); }
    if(steps.length===1) return;
    let lo=1, hi=steps.length-1;
    while(lo<hi){ const mid=(lo+hi)>>1; if(fits(steps[mid])) hi=mid; else lo=mid+1; }
    el.style.setProperty(name,steps[lo]);
  }
  function fitAll(){
    const layers=$("#dz-layers"); if(!layers) return;
    if(window.matchMedia("(max-width:640px)").matches){ layers.className="dz-layers"; layers.style.setProperty("--rs",1); return; }
    const ok=()=>layers.scrollHeight<=layers.clientHeight+1;
    for(const [c,mx,mn] of [[1,1.08,.5],[2,.95,.45]]){ layers.className="dz-layers"+(c>1?" c"+c:""); fitVar(layers,"--rs",mx,mn); if(ok()) break; }
    if(layers.classList.contains("c2")||parseFloat(layers.style.getPropertyValue("--rs"))<.85) layers.classList.add("tight");
  }
  let fitRaf=0;
  function scheduleFit(){ if(fitRaf) return; fitRaf=requestAnimationFrame(()=>{ fitRaf=0; fitAll(); }); }
  window.addEventListener("resize",scheduleFit);
  if(document.fonts&&document.fonts.ready) document.fonts.ready.then(scheduleFit);

  // ---- scheda prodotto: usa come… + dimensioni e pesi ----
  function openSheet(id){
    sheetIng=id; const it=ITEM[id], m=metaOf(id), roles=rolesOf(it);
    const fld=(label,field,val,unit)=>`<label class="dz-fld">${label}<input type="number" inputmode="decimal" data-field="${field}" min="0" step="1" value="${val||""}" placeholder="0"><span class="unit">${unit}</span></label>`;
    $("#dz-sheet-body").innerHTML=`
      <div class="dz-shead"><span class="dz-thumb big">${thumbImg(id)}</span><div><h3>${escapeHtml(it.n)}</h3><span class="pc-field-label" style="margin:0;">${escapeHtml(it.g)}</span></div></div>
      <div><span class="pc-field-label">Usa come</span><div class="dz-roles">${roles.map((ro,i)=>`<button class="pc-btn ${i?"ghost":"gold"} small" data-act="sheet-use" data-role="${ro}">${ro==="layer"?"+ Strato":ro==="coat"?(cake.recipe.coat===id?"Togli copertura":"Copertura"):ro==="mix"?"+ Nell'impasto":"+ Decorazione"}</button>`).join("")}</div></div>
      ${roles.includes("deco")?`<label class="dz-fld">Dimensione<input type="range" data-field="size" min="2" max="45" step="1" value="${m.size}"><output>${m.size}%</output></label>`:""}
      ${roles.includes("layer")?fld("Peso / strato","wLayer",m.wLayer,"g"):""}
      ${roles.includes("coat")?fld("Peso copertura 100%","wCoat",m.wCoat,"g"):""}
      ${roles.includes("deco")?fld("Peso / pezzo","wDeco",m.wDeco,"g"):""}
      <p class="pc-settings-note" style="margin:0;">Pesi riferiti a una torta Ø 24 cm e spessore 1 (plumcake, muffin, panettone, pagnotta e bun in proporzione); compaiono nella scheda PDF.</p>`;
    $("#dz-sheet").hidden=false;
  }
  function closeSheet(){ sheetIng=null; $("#dz-sheet").hidden=true; }

  // ===================== SCHEDA PDF =====================
  let downloadsCap=null;
  (async()=>{ try{ downloadsCap=window.claude&&window.claude.use?await window.claude.use("downloads"):null; }catch(e){ downloadsCap=null; } })();
  async function saveBlob(blob,filename){
    if(downloadsCap) return downloadsCap.save({filename,data:blob});
    const url=URL.createObjectURL(blob), a=document.createElement("a");
    a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000);
    return {status:"saved"};
  }
  const pdfText = s => String(s).replace(/[–—]/g,"-").replace(/[“”]/g,'"').replace(/[’]/g,"'");
  function slugify(s){ return (s||"").toString().toLowerCase().trim().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g,"-").replace(/^-+|-+$/g,"")||"torta"; }
  // crea la scheda e restituisce {blob, filename, title}; null se la libreria PDF manca
  async function buildPDF(){
    if(!window.jspdf){ toast("La libreria PDF non è stata caricata. Controlla la connessione e ricarica."); return null; }
    const r=cake.recipe, st=recipeStats(r), tf=tierFactor(r);
    const {jsPDF}=window.jspdf, doc=new jsPDF({unit:"mm",format:"a4"}), W=210, H=297, M=16;
    const date=new Date().toLocaleDateString("it-IT",{day:"2-digit",month:"long",year:"numeric"});
    doc.setFillColor(29,5,61); doc.rect(0,0,W,24,"F"); doc.setFillColor(255,228,0); doc.circle(M+2,12,2,"F");
    doc.setFont("helvetica","bold"); doc.setFontSize(15); doc.setTextColor(255,255,255); doc.text("Zeelandia Cake Designer",M+7,13.8);
    doc.setFont("helvetica","normal"); doc.setFontSize(9); doc.setTextColor(203,185,232); doc.text("Scheda progetto  ·  "+date,W-M,13.8,{align:"right"});
    doc.setFillColor(255,228,0); doc.rect(0,24,W,1.6,"F");
    const title=pdfText((cake.name||"").trim()||"Torta senza nome");
    let fs=26; doc.setFont("helvetica","bold"); doc.setFontSize(fs); while(doc.getTextWidth(title)>W-2*M&&fs>12){ fs--; doc.setFontSize(fs); }
    doc.setTextColor(29,5,61); doc.text(title,M,39);
    doc.setFont("helvetica","normal"); doc.setFontSize(10.5); doc.setTextColor(110,100,128);
    doc.text(pdfText(`${SHAPE_NAME[r.shape]||"Rotonda"}${hasTiers(r)?`, ${r.tiers||1} ${(r.tiers||1)===1?"piano":"piani"}`:""}  ·  ${st.layers} strati, ${st.pieces} decorazioni`),M,46);
    const shot=interior=>{ const c=document.createElement("canvas"); c.width=c.height=1500; drawCake(c.getContext("2d"),1500,r,{bg:"#FFFFFF",interior}); return c.toDataURL("image/jpeg",.92); };
    let y=165;
    if((r.mix||[]).some(m=>ITEM[m.ingId])){
      const IS=86; doc.addImage(shot(false),"JPEG",W/2-IS-3,50,IS,IS); doc.addImage(shot(true),"JPEG",W/2+3,50,IS,IS);
      doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(110,100,128);
      doc.text("ESTERNO",W/2-IS/2-3,140,{align:"center"}); doc.text("SEZIONE (INTERNO)",W/2+IS/2+3,140,{align:"center"}); y=152;
    } else { const IS=104; doc.addImage(shot(false),"JPEG",(W-IS)/2,50,IS,IS); }
    const head=()=>{ doc.setFont("helvetica","bold"); doc.setFontSize(8); doc.setTextColor(110,100,128);
      doc.text("PRODOTTO",M+14,y); doc.text("USO",120,y); doc.text("QUANTITÀ",158,y,{align:"right"}); doc.text("G TOTALI",W-M,y,{align:"right"});
      doc.setDrawColor(29,5,61); doc.setLineWidth(.5); doc.line(M,y+2.5,W-M,y+2.5); y+=9; };
    head();
    const RH=11.5;
    const row=(id,cat,use,qty,gtot)=>{
      if(y+RH>H-M-14){ doc.addPage(); y=M+4; head(); }
      doc.addImage(getArt(id).toDataURL("image/png"),"PNG",M,y-4.2,9,9);
      doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(29,5,61); doc.text(pdfText(nameOf(id)),M+14,y+.6,{maxWidth:88});
      doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(110,100,128); doc.text(pdfText(cat).toUpperCase(),M+14,y+4.2);
      doc.setFontSize(10); doc.setTextColor(29,5,61); doc.text(use,120,y+1.5); doc.text(qty,158,y+1.5,{align:"right"}); doc.text(gtot,W-M,y+1.5,{align:"right"});
      doc.setDrawColor(226,222,232); doc.setLineWidth(.2); doc.line(M,y+6.2,W-M,y+6.2); y+=RH;
    };
    let grams=0;
    if(r.coat&&ITEM[r.coat]){ const w=metaOf(r.coat).wCoat*tf*coatWeightK(r); grams+=w; row(r.coat,INGREDIENTS[catOf(r.coat)].label,"Copertura",Math.round(coatPct(r)*100)+"%",w>0?fmtNum(w,0):"-"); }
    r.decos.filter(d=>ITEM[d.ingId]).forEach(d=>{ const w=metaOf(d.ingId).wDeco*d.count; grams+=w; row(d.ingId,INGREDIENTS[catOf(d.ingId)].label,"Decorazione",d.count+" pz",w>0?fmtNum(w,0):"-"); });
    const ls=r.layers.filter(l=>ITEM[l.ingId]);
    (r.mix||[]).filter(m=>ITEM[m.ingId]).forEach(m=>{ const L=mixLayer(r,m), w=metaOf(m.ingId).wDeco*m.count*tf; grams+=w;
      row(m.ingId,INGREDIENTS[catOf(m.ingId)].label+(L?` · nello strato ${ls.length-ls.indexOf(L)}`:""),"Nell'impasto",m.count+" pz",w>0?fmtNum(w,0):"-"); });
    ls.slice().reverse().forEach((l,k)=>{ const w=metaOf(l.ingId).wLayer*l.thick*tf; grams+=w; row(l.ingId,INGREDIENTS[catOf(l.ingId)].label,`Strato ${ls.length-k}`,"spess. "+l.thick,w>0?fmtNum(w,0):"-"); });
    if(!ls.length&&!r.coat&&!r.decos.length){ doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(110,100,128); doc.text("Nessun prodotto scelto.",M+14,y+2); y+=RH; }
    if(y+RH>H-M-6){ doc.addPage(); y=M+4; }
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(29,5,61); doc.text("Totale stimato",M+14,y+1.5); doc.text(grams>0?fmtNum(grams,0)+" g":"-",W-M,y+1.5,{align:"right"});
    doc.setDrawColor(29,5,61); doc.setLineWidth(.6); doc.line(M,H-M-7,W-M,H-M-7);
    doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor(180,172,196); doc.text("Zeelandia Cake Designer",M,H-M-2);
    doc.setFont("helvetica","normal"); doc.setTextColor(110,100,128); doc.text(title,W-M,H-M-2,{align:"right"});
    return { blob:doc.output("blob"), filename:`torta-${slugify(title)}.pdf`, title };
  }
  async function makePDF(){
    const res=await buildPDF(); if(!res) return;
    try{ await saveBlob(res.blob,res.filename); toast("Scheda salvata."); }
    catch(err){ toast(err&&err.code==="declined"?"Salvataggio annullato.":"Impossibile salvare il PDF."); }
  }

  // ===================== EVENTI =====================
  document.addEventListener("click", e=>{
    if(e.target.id==="dz-sheet"){ closeSheet(); return; }
    const b=e.target.closest("[data-act]"); if(!b) return;
    const act=b.dataset.act, id=b.dataset.id, r=cake.recipe;
    switch(act){
      case "dz-tab": activeCat=b.dataset.v; refreshDesigner(); animateTilesEnter(); return;
      case "dz-pick": useAs(id,viewMode==="in"&&mixArtOf(ITEM[id])?"mix":ITEM[id].role); return;
      case "dz-view": viewMode=b.dataset.v; cakeAnim=null; refreshDesigner(); return;
      case "dz-adjust": openSheet(id); return;
      case "sheet-use": { const ing=sheetIng; closeSheet(); useAs(ing,b.dataset.role); return; }
      case "sheet-close": closeSheet(); return;
      case "dz-shape": r.shape=b.dataset.v; refreshDesigner(); return;
      case "dz-tiers": r.tiers=+b.dataset.v; refreshDesigner(); return;
      case "dz-shuffle": { r.decos.forEach(d=>{ d.seed=newSeed(); delete d.moved; }); r.layers.forEach(l=>l.seed=newSeed()); const s=$(".dz-stage"); if(s){ s.classList.remove("bounce"); void s.offsetWidth; s.classList.add("bounce"); } cakeAnim=r.decos.length?{deco:r.decos[r.decos.length-1].id,from:0}:null; drawCakeCanvas(); return; }
      case "dz-clear": clearAll(b); return;
      case "dz-pdf": makePDF(); return;
      case "dz-rm-coat": r.coat=null; refreshDesigner(); return;
    }
    const li=b.closest("[data-layer]"), ld=b.closest("[data-deco]"), lm=b.closest("[data-mix]");
    if(lm){
      const m=(r.mix||[]).find(x=>x.id===lm.dataset.mix); if(!m) return;
      if(act==="dz-inc") m.count=Math.min(99,m.count+1);
      else if(act==="dz-dec") m.count=Math.max(1,m.count-1);
      else if(act==="dz-reshuffle") m.seed=newSeed();
      else if(act==="dz-rm") r.mix=r.mix.filter(x=>x!==m);
      refreshDesigner(); return;
    }
    if(li){
      const L=r.layers.find(l=>l.id===li.dataset.layer); if(!L) return;
      if(act==="dz-inc") L.thick=Math.min(6,L.thick+1);
      else if(act==="dz-dec") L.thick=Math.max(1,L.thick-1);
      else if(act==="dz-rm") r.layers=r.layers.filter(l=>l!==L);
      else if(act==="dz-up"||act==="dz-down"){ const i=r.layers.indexOf(L), j=act==="dz-up"?i+1:i-1; if(j>=0&&j<r.layers.length){ r.layers[i]=r.layers[j]; r.layers[j]=L; } }
      refreshDesigner();
    } else if(ld){
      const d=r.decos.find(x=>x.id===ld.dataset.deco); if(!d) return;
      if(act==="dz-inc"){ const from=d.count; d.count=Math.min(99,d.count+1); cakeAnim={deco:d.id,from}; }
      else if(act==="dz-dec") d.count=Math.max(1,d.count-1);
      else if(act==="dz-reshuffle"){ d.seed=newSeed(); delete d.moved; cakeAnim={deco:d.id,from:0}; }
      else if(act==="dz-rm") r.decos=r.decos.filter(x=>x!==d);
      refreshDesigner();
    }
  });
  document.addEventListener("input", e=>{
    const t=e.target;
    if(t.dataset.field==="coatpct"){ cake.recipe.coatPct=+t.value; t.nextElementSibling.textContent=t.value+"%"; if(!dragRaf) dragRaf=requestAnimationFrame(()=>{ dragRaf=0; drawCakeCanvas(); }); return; }
    if(t.id==="cake-name"){ cake.name=t.value; $("#dz-title").textContent=cakeTitle(); return; }
    if(sheetIng&&t.dataset.field==="size"){ metaOf(sheetIng).size=+t.value; t.nextElementSibling.textContent=t.value+"%"; drawCakeCanvas(); return; }
    if(sheetIng&&/^w(Layer|Coat|Deco)$/.test(t.dataset.field||"")){ metaOf(sheetIng)[t.dataset.field]=Math.max(0,parseFloat(t.value)||0); return; }
  });
  document.addEventListener("change", e=>{
    const t=e.target;
    if(t.dataset.field!=="thick"&&t.dataset.field!=="count"&&t.dataset.field!=="mixlayer") return;
    const r=cake.recipe, li=t.closest("[data-layer]"), ld=t.closest("[data-deco]"), lm=t.closest("[data-mix]");
    if(lm){ const m=(r.mix||[]).find(x=>x.id===lm.dataset.mix); if(m){ if(t.dataset.field==="mixlayer") m.layer=t.value; else m.count=Math.max(1,Math.min(99,parseInt(t.value,10)||1)); } }
    if(li){ const L=r.layers.find(l=>l.id===li.dataset.layer); if(L) L.thick=Math.max(1,Math.min(6,parseInt(t.value,10)||1)); }
    if(ld){ const d=r.decos.find(x=>x.id===ld.dataset.deco); if(d) d.count=Math.max(1,Math.min(99,parseInt(t.value,10)||1)); }
    refreshDesigner();
  });
  document.addEventListener("keydown", e=>{ if(e.key==="Escape"&&!$("#dz-sheet").hidden) closeSheet(); });

  // ---- trascina le decorazioni nel disegno ----
  let drag=null, dragRaf=0;
  function canvasPoint(cv,e){
    const b=cv.getBoundingClientRect(), sc=Math.min(b.width/cv.width,b.height/cv.height);
    return { x:(e.clientX-b.left-(b.width-cv.width*sc)/2)/sc, y:(e.clientY-b.top-(b.height-cv.height*sc)/2)/sc };
  }
  function hitDeco(pt){ for(let k=decoHits.length-1;k>=0;k--){ const h=decoHits[k]; if(pt.x>=h.x0&&pt.x<=h.x1&&pt.y>=h.y0&&pt.y<=h.y1) return h; } return null; }
  document.addEventListener("pointerdown", e=>{
    const cv=e.target.id==="dz-cv"?e.target:null; if(!cv||e.button>0) return;
    const pt=canvasPoint(cv,e), h=hitDeco(pt); if(!h) return;
    e.preventDefault(); cv.setPointerCapture(e.pointerId);
    cancelAnimationFrame(animRaf); cakeAnim=null;
    drag={id:h.id, i:h.i, dx:pt.x-h.x, dy:pt.y-h.y, ref:h.ref, ox:h.ox, oy:h.oy};
    cv.style.cursor="grabbing";
  });
  document.addEventListener("pointermove", e=>{
    const cv=$("#dz-cv"); if(!cv) return;
    if(!drag){ if(e.target===cv) cv.style.cursor=hitDeco(canvasPoint(cv,e))?"grab":""; return; }
    const d=cake.recipe.decos.find(x=>x.id===drag.id); if(!d){ drag=null; return; }
    const pt=canvasPoint(cv,e), x=Math.max(0,Math.min(cv.width,pt.x-drag.dx)), y=Math.max(0,Math.min(cv.height,pt.y-drag.dy));
    (d.moved||(d.moved={}))[drag.i]=[(x-drag.ox)/drag.ref,(y-drag.oy)/drag.ref];
    if(!dragRaf) dragRaf=requestAnimationFrame(()=>{ dragRaf=0; drawCakeCanvas(); });
  });
  const endDrag=()=>{ if(!drag) return; drag=null; const cv=$("#dz-cv"); if(cv) cv.style.cursor="grab"; };
  document.addEventListener("pointerup",endDrag); document.addEventListener("pointercancel",endDrag);

  render();
})();
</script>
</body>
