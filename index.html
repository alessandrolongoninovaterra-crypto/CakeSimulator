  function fitVar(el,name,max,min){
    const fits=v=>{ el.style.setProperty(name,v); return el.scrollHeight<=el.clientHeight+1; };
    if(fits(max)) return;
    const steps=[max]; let v=max; while(v>min){ v=Math.round((v-.04)*100)/100; steps.push(v); }
    if(steps.length===1) return;
    let lo=1, hi=steps.length-1;
    while(lo<hi){ const mid=(lo+hi)>>1; if(fits(steps[mid])) hi=mid; else lo=mid+1; }
    el.style.setProperty(name,steps[lo]);
  }

      doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(29,5,61); doc.text(pdfText(nameOf(id)),M+14,y+.6,{maxWidth:88});
      doc.setFont("helvetica","normal"); doc.setFontSize(7.5); doc.setTextColor(110,100,128); doc.text(pdfText(cat).toUpperCase(),M+14,y+4.2);
      doc.setFontSize(10); doc.setTextColor(29,5,61); doc.text(use,120,y+1.5); doc.text(qty,158,y+1.5,{align:"right"}); doc.text(gtot,W-M,y+1.5,{align:"right"});
      doc.setDrawColor(226,222,232); doc.setLineWidth(.2); doc.line(M,y+6.2,W-M,y+6.2); y+=RH;
    };
    let grams=0;
    if(r.coat&&ITEM[r.coat]){ const w=metaOf(r.coat).wCoat*tf; grams+=w; row(r.coat,INGREDIENTS[catOf(r.coat)].label,"Copertura","1",w>0?fmtNum(w,0):"-"); }
    r.decos.filter(d=>ITEM[d.ingId]).forEach(d=>{ const w=metaOf(d.ingId).wDeco*d.count; grams+=w; row(d.ingId,INGREDIENTS[catOf(d.ingId)].label,"Decorazione",d.count+" pz",w>0?fmtNum(w,0):"-"); });
    const ls=r.layers.filter(l=>ITEM[l.ingId]);
    ls.slice().reverse().forEach((l,k)=>{ const w=metaOf(l.ingId).wLayer*l.thick*tf; grams+=w; row(l.ingId,INGREDIENTS[catOf(l.ingId)].label,`Strato ${ls.length-k}`,"spess. "+l.thick,w>0?fmtNum(w,0):"-"); });
    if(!ls.length&&!r.coat&&!r.decos.length){ doc.setFont("helvetica","normal"); doc.setFontSize(10); doc.setTextColor(110,100,128); doc.text("Nessun prodotto scelto.",M+14,y+2); y+=RH; }
    if(y+RH>H-M-6){ doc.addPage(); y=M+4; }
    doc.setFont("helvetica","bold"); doc.setFontSize(10.5); doc.setTextColor(29,5,61); doc.text("Totale stimato",M+14,y+1.5); doc.text(grams>0?fmtNum(grams,0)+" g":"-",W-M,y+1.5,{align:"right"});
    doc.setDrawColor(29,5,61); doc.setLineWidth(.6); doc.line(M,H-M-7,W-M,H-M-7);
    doc.setFont("helvetica","bold"); doc.setFontSize(8.5); doc.setTextColor(180,172,196); doc.text("Zeelandia Cake Contest",M,H-M-2);
    doc.setFont("helvetica","normal"); doc.setTextColor(110,100,128); doc.text(pdfText(`${teamName(teamId)}  ·  ${title}`),W-M,H-M-2,{align:"right"});
    const slug=slugify(`${teamName(teamId)} ${title}`).replace(/_/g,"-");
    try{ await saveBlob(doc.output("blob"),`torta-${slug}.pdf`); toast("Scheda salvata."); }
    catch(err){ toast(err&&err.code==="declined"?"Salvataggio annullato.":"Impossibile salvare il PDF."); }
  }

  // ===================== EVENTI =====================
  document.addEventListener("click", e=>{
    if(e.target.id==="dz-sheet"){ closeSheet(); return; }
    const b=e.target.closest("[data-act]"); if(!b) return;
    const act=b.dataset.act, id=b.dataset.id;
    switch(act){
      case "goto": view=b.dataset.v; render(); return;
      case "back": view="organizer"; render(); return;
      case "start-t": orgStartTurno(+b.dataset.n); return;
      case "pause-t": orgTogglePause(); return;
      case "reset-t": orgResetTurno(); return;
      case "open-team": openTeam(id); return;
      case "rm-ing": removeIngredient(b.dataset.cat,id); return;
      case "add-ing": { const inp=document.getElementById("add-"+b.dataset.cat); addIngredient(b.dataset.cat,inp&&inp.value); return; }
      case "dz-tab": activeCat=b.dataset.v; refreshDesigner(); animateTilesEnter(); return;
      case "dz-pick": useAs(id,ITEM[id].role); return;
      case "dz-adjust": openSheet(id); return;
      case "sheet-use": { const ing=sheetIng; closeSheet(); useAs(ing,b.dataset.role); return; }
      case "sheet-close": closeSheet(); return;
      case "dz-shape": if(isLocked()) return; curTeam().recipe.shape=b.dataset.v; refreshDesigner(); return;
      case "dz-tiers": if(isLocked()) return; curTeam().recipe.tiers=+b.dataset.v; refreshDesigner(); return;
      case "dz-shuffle": { const r=curTeam().recipe; r.decos.forEach(d=>d.seed=newSeed()); r.layers.forEach(l=>l.seed=newSeed()); const s=$(".dz-stage"); if(s){ s.classList.remove("bounce"); void s.offsetWidth; s.classList.add("bounce"); } cakeAnim=r.decos.length?{deco:r.decos[r.decos.length-1].id,from:0}:null; drawTeamCake(); return; }
      case "dz-clear": clearAll(b); return;
      case "dz-pdf": makePDF(selectedTeam); return;
      case "dz-confirm": confirmCake(); return;
      case "dz-edit": curTeam().status="attesa"; render(); return;
      case "dz-rm-coat": if(isLocked()) return; curTeam().recipe.coat=null; refreshDesigner(); return;
    }
    if(isLocked()) return;
    const r=curTeam().recipe;
    const li=b.closest("[data-layer]"), ld=b.closest("[data-deco]");
    if(li){
      const L=r.layers.find(l=>l.id===li.dataset.layer); if(!L) return;
      if(act==="dz-inc") L.thick=Math.min(6,L.thick+1);
      else if(act==="dz-dec") L.thick=Math.max(1,L.thick-1);
      else if(act==="dz-rm") r.layers=r.layers.filter(l=>l!==L);
      else if(act==="dz-up"||act==="dz-down"){ const i=r.layers.indexOf(L), j=act==="dz-up"?i+1:i-1; if(j>=0&&j<r.layers.length){ r.layers[i]=r.layers[j]; r.layers[j]=L; } }
      refreshDesigner();
    } else if(ld){
      const d=r.decos.find(x=>x.id===ld.dataset.deco); if(!d) return;
      if(act==="dz-inc"){ const from=d.count; d.count=Math.min(99,d.count+1); cakeAnim={deco:d.id,from}; }
      else if(act==="dz-dec") d.count=Math.max(1,d.count-1);
      else if(act==="dz-reshuffle"){ d.seed=newSeed(); cakeAnim={deco:d.id,from:0}; }
      else if(act==="dz-rm") r.decos=r.decos.filter(x=>x!==d);
      refreshDesigner();
    }
  });
  document.addEventListener("input", e=>{
    const t=e.target;
    if(t.id==="team-name"){ curTeam().name=t.value.trim(); const h=$("#dz-title"); if(h) h.textContent=teamName(selectedTeam); return; }
    if(t.id==="cake-name"){ curTeam().cakeName=t.value; return; }
    if(t.id==="rules-input"){ RULES_TEXT=t.value; return; }
    if(t.dataset.teamname){ teams[t.dataset.teamname].name=t.value.trim(); return; }
    if(sheetIng&&t.dataset.field==="size"){ metaOf(sheetIng).size=+t.value; t.nextElementSibling.textContent=t.value+"%"; drawTeamCake(); return; }
    if(sheetIng&&/^w(Layer|Coat|Deco)$/.test(t.dataset.field||"")){ metaOf(sheetIng)[t.dataset.field]=Math.max(0,parseFloat(t.value)||0); return; }
  });
  document.addEventListener("change", e=>{
    const t=e.target;
    if(t.dataset.setup){ applySetup(t.dataset.setup,t.value); return; }
    if(view==="team"&&!isLocked()&&(t.dataset.field==="thick"||t.dataset.field==="count")){
      const r=curTeam().recipe, li=t.closest("[data-layer]"), ld=t.closest("[data-deco]");
      if(li){ const L=r.layers.find(l=>l.id===li.dataset.layer); if(L) L.thick=Math.max(1,Math.min(6,parseInt(t.value,10)||1)); }
      if(ld){ const d=r.decos.find(x=>x.id===ld.dataset.deco); if(d) d.count=Math.max(1,Math.min(99,parseInt(t.value,10)||1)); }
      refreshDesigner();
    }
  });
  document.addEventListener("keydown", e=>{
    if(e.key==="Escape"&&sheetIng){ closeSheet(); return; }
    if(e.key==="Enter"&&e.target.dataset&&e.target.dataset.catInput){ addIngredient(e.target.dataset.catInput,e.target.value); }
  });

  // ===================== TICKER =====================
  setInterval(()=>{
    if(!timer.running) return;
    const rem=remainingSeconds(), n=timer.currentTurno;
    if(GAME.alertMinutes>0&&timer.total>GAME.alertMinutes*60&&rem<=GAME.alertMinutes*60&&rem>0&&!alertShown[n]){ alertShown[n]=true; showAlertPopup(); }
    if(rem<=0){ timer.running=false; timer.startedAt=null; timer.duration=0; if(!alarmPlayed[n]){ alarmPlayed[n]=true; showFinishPopup(); } }
    if(view==="organizer") updateOrganizerLive(); else if(view==="team") updateTeamLive();
  },1000);

  render();
})();
</script>
</body>
</html>
